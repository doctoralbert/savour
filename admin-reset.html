<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savour — Nieuw adminwachtwoord</title><style>
:root{background:#030506;color:#eee8dc;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#1b2925 0,#070b0c 38%,#030506 72%)}.card{width:min(430px,calc(100% - 32px));padding:42px;border:1px solid #384240;border-radius:18px;background:linear-gradient(145deg,#0e1717f2,#060a0bf2);box-shadow:0 35px 100px #000a}.brand{font-family:Georgia,serif;letter-spacing:.34em;color:#e1c37a;font-size:22px}.kicker{margin-top:18px;color:#a18b59;font-size:9px;letter-spacing:.22em;font-weight:700}.card h1{font-family:Georgia,serif;font-weight:500;font-size:36px;margin:8px 0}.card p{color:#9fa9a3;line-height:1.6}.field{margin-top:18px}.field label{display:block;color:#bfc5c0;font-size:11px;margin-bottom:7px}.field input{width:100%;border:1px solid #354140;border-radius:8px;background:#070d0e;color:#f3eee4;padding:13px 14px;outline:none}.button{width:100%;margin-top:20px;border:1px solid #d0ad60;border-radius:8px;background:#d0ad60;color:#15120c;padding:13px;font-weight:700;cursor:pointer}.status{min-height:18px;margin-top:12px;color:#cbb477;font-size:11px}.back{display:block;margin-top:25px;text-align:center;color:#8f9994;font-size:11px;text-decoration:none}
</style></head><body><main class="card"><div class="brand">SAVOUR</div><div class="kicker">ADMINISTRATIE</div><h1>Nieuw wachtwoord.</h1><p>Kies een nieuw wachtwoord voor je Savour admin-account.</p><form id="form"><div class="field"><label>Nieuw wachtwoord</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Herhaal wachtwoord</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div><button class="button" type="submit">Wachtwoord opslaan</button><div class="status" id="status"></div></form><a class="back" href="/admin">← Terug naar admin</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient('https://qmzfqfmpylkgcnxsedse.supabase.co','sb_publishable_R8DGUuglOC3aFz5qv4xOgw_UGdQUyiD',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById('status');
(async()=>{const h=location.hash.startsWith('#')?location.hash.slice(1):'';const params=new URLSearchParams(h);const access_token=params.get('access_token'),refresh_token=params.get('refresh_token');if(access_token&&refresh_token){const {error}=await client.auth.setSession({access_token,refresh_token});if(error)status.textContent='Deze herstel-link is ongeldig of verlopen.'}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a!==b){status.textContent='De wachtwoorden komen niet overeen.';return}const {error}=await client.auth.updateUser({password:a});if(error){status.textContent='Wachtwoord wijzigen is mislukt.';return}status.textContent='Je wachtwoord is gewijzigd. Je kunt nu inloggen.';e.target.querySelector('button').disabled=true});
</script></body></html>
