<!doctype html>
<!-- Deelafbeelding (1200 × 630) voor links naar savour.page, zoals de bovenkant van de homepage: de kop links,
     laptop en telefoon met echte schermafbeeldingen rechts. Opnieuw maken: open dit bestand in Chrome op
     1200 × 630 en sla een schermafdruk op als assets/savour-og.png (zie tools/build-seo.mjs, kop). -->
<html lang="nl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#060a0b}
body{font-family:'DM Sans',sans-serif;color:#eee8dc;position:relative;
background:radial-gradient(700px 480px at 82% 42%,rgba(232,202,141,.10),transparent 70%),linear-gradient(180deg,#0b1213,#050909)}
.brand{position:absolute;left:72px;top:56px;font-family:'Playfair Display',serif;letter-spacing:.42em;color:#eee8dc;font-size:26px}
.copy{position:absolute;left:72px;top:124px;width:520px}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:58px;line-height:1.07;letter-spacing:-.01em}
.lead{margin-top:26px;color:#b9c0ba;font-size:23px;line-height:1.45;max-width:470px}
.lead b{color:#eee8dc;font-weight:600}
.cta{position:absolute;left:72px;bottom:56px;display:flex;align-items:center;gap:22px}
.pill{background:#e8ca8d;color:#111;font-weight:700;font-size:21px;padding:14px 26px;border-radius:999px}
.url{color:#e8ca8d;font-size:22px;font-weight:600}
.laptop{position:absolute;left:630px;top:132px;width:520px;border:1px solid #2a3536;border-radius:14px;background:#0b1112;padding:8px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.laptop img{display:block;width:100%;border-radius:8px}
.phone{position:absolute;left:990px;top:196px;width:168px;border:1px solid #3a4546;border-radius:26px;background:#050808;padding:7px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.phone img{display:block;width:100%;border-radius:20px}
</style></head><body>
<div class="brand">SAVOUR</div>
<div class="copy">
  <h1>Je hele receptenboek, op elke telefoon in de keuken.</h1>
  <p class="lead">Het <b>receptenplatform</b> voor de professionele keuken.</p>
</div>
<div class="cta"><span class="pill">Gratis beginnen</span><span class="url">savour.page</span></div>
<div class="laptop"><img src="../assets/app/bibliotheek-nl.jpg" alt=""></div>
<div class="phone"><img src="../assets/app/recept-nl.jpg" alt=""></div>
</body></html>
