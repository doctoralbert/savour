<!doctype html>
<!-- Engelse deelafbeelding (1200 × 630) met de keuken als achtergrond, voor links naar de Engelse pagina's.
     Opnieuw maken: open dit bestand in Chrome op 1200 × 630 en sla een schermafdruk op als assets/savour-og-en.png. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#060a0b}
body{font-family:'DM Sans',sans-serif;color:#eee8dc;position:relative}
.photo{position:absolute;inset:0;background:url(../assets/keuken/hero-keuken.jpg) 62% center/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,9,9,.82) 0%,rgba(5,9,9,.68) 38%,rgba(5,9,9,.18) 62%,rgba(5,9,9,0) 100%)}
h1,.lead,.brand{text-shadow:0 2px 18px rgba(0,0,0,.65)}
.brand{position:absolute;left:72px;top:56px;font-family:'Playfair Display',serif;letter-spacing:.42em;color:#eee8dc;font-size:26px}
.copy{position:absolute;left:72px;top:124px;width:600px}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:62px;line-height:1.07;letter-spacing:-.01em}
.lead{margin-top:26px;color:#d0d3cc;font-size:24px;line-height:1.45;max-width:500px}
.lead b{color:#eee8dc;font-weight:600}
.cta{position:absolute;left:72px;bottom:56px;display:flex;align-items:center;gap:22px}
.pill{background:#e8ca8d;color:#111;font-weight:700;font-size:21px;padding:14px 26px;border-radius:999px}
.url{color:#e8ca8d;font-size:22px;font-weight:600}
.phone{position:absolute;right:84px;top:44px;width:262px;border:1px solid #4a5556;border-radius:34px;background:#050808;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.75)}
.phone img{display:block;width:100%;border-radius:26px}
</style></head><body>
<div class="photo"></div>
<div class="shade"></div>
<div class="brand">SAVOUR</div>
<div class="copy">
  <h1>Your whole recipe book, on every phone in the kitchen.</h1>
  <p class="lead">The <b>recipe platform</b> for professional kitchens.</p>
</div>
<div class="cta"><span class="pill">Start for free</span><span class="url">savour.page</span></div>
<div class="phone"><img src="../assets/app/recept-en.jpg" alt=""></div>
</body></html>
