<!doctype html>
<!-- App-icoon en favicon (sinds 2026-11-23): één S in Playfair Display (huisstijl) op zwart, met de gouden streep
     eronder, zoals in het woordmerk. ?beheer: dezelfde S omgedraaid (zwart op goud) voor de beheer-app (/admin).
     Gemaakt als schermafdruk van 512 × 512 (headless Chrome) en verkleind met sharp naar assets/savour-icon.png,
     assets/icons/* en favicon.ico; voor Beheer naar assets/beheer-icon.png en assets/icons/beheer-*.
     Het teken blijft binnen het midden (80%), zodat het ook als rond of afgerond app-icoon niet wordt afgesneden.
     Vorige versies: het woordmerk SAVOUR en SAV/OUR (tot 2026-11-23). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden}
  svg{display:block}
</style></head>
<body>
<svg id="icon" width="512" height="512" viewBox="0 0 512 512">
  <rect id="bg" width="512" height="512" fill="#000"/>
  <text id="s" x="256" y="340" text-anchor="middle" font-family="Playfair Display" font-weight="500" font-size="300" fill="#f2eee4">S</text>
  <rect id="bar" x="181" y="374" width="150" height="14" fill="#e8ca8d"/>
</svg>
<script>
  if (/beheer/.test(location.search)) {
    document.getElementById('bg').setAttribute('fill', '#e8ca8d');
    document.getElementById('s').setAttribute('fill', '#000');
    document.getElementById('bar').setAttribute('fill', '#000');
  }
</script>
</body></html>
