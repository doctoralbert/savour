<!doctype html>
<!-- Gewone Instagram-posts Savour (2026-11-24), 1080 × 1350. Openen met ?p=1 t/m 4, direct als bestand in headless Chrome
     (zie ../README.md). Alleen echte schermen uit de demo (assets/app). -->
<html lang="nl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif; color: #f2eee4; position: relative;
    background: radial-gradient(1100px 700px at 75% 35%, rgba(232, 202, 141, 0.10), transparent 60%), linear-gradient(180deg, #0d1314, #050808);
  }
  .post { position: absolute; inset: 0; padding: 84px 84px 0; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .s { width: 64px; height: 64px; background: #000; display: grid; place-items: center; border-radius: 12px; position: relative; }
  .brand .s b { font: 500 46px/1 'Playfair Display', serif; color: #f2eee4; margin-top: -6px; }
  .brand .s i { position: absolute; bottom: 12px; width: 22px; height: 3px; background: #e8ca8d; }
  .brand span { font: 500 28px 'Playfair Display', serif; letter-spacing: 0.42em; }
  .kicker { margin-top: 56px; font: 600 24px 'DM Sans'; letter-spacing: 0.2em; color: #e8ca8d; text-transform: uppercase; }
  h1 { margin-top: 18px; font: 600 80px/1.05 'Playfair Display', serif; letter-spacing: -0.01em; }
  h1 em { font-style: italic; color: #e8ca8d; font-weight: 500; }
  .sub { margin-top: 24px; font-size: 31px; line-height: 1.4; color: #cfcabe; max-width: 880px; }
  /* telefoon die onderaan uit beeld loopt */
  .phone { position: absolute; left: 50%; transform: translateX(-50%); top: 600px; width: 600px; border-radius: 64px; padding: 16px;
    background: #121718; border: 2px solid #2a3233; box-shadow: 0 40px 90px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,202,141,0.15); }
  .phone .screen { border-radius: 50px; overflow: hidden; background: #0b0f10; }
  .phone .screen img { width: 100%; display: block; }
  /* brede kaart */
  .card { position: absolute; left: 60px; right: 60px; bottom: 160px; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(232,202,141,0.35); box-shadow: 0 40px 90px rgba(0,0,0,0.7); }
  .card img { width: 100%; display: block; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 70px; font-size: 26px; color: #a9a497; display: flex; justify-content: space-between; }
  .foot b { color: #f2eee4; font-weight: 600; }
  /* kennismaking */
  .intro { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 84px; }
  .intro .logo { width: 260px; height: 260px; background: #000; border-radius: 48px; display: grid; place-items: center; position: relative;
    box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,202,141,0.2); }
  .intro .logo b { font: 500 190px/1 'Playfair Display', serif; margin-top: -24px; }
  .intro .logo i { position: absolute; bottom: 50px; width: 76px; height: 7px; background: #e8ca8d; }
  .intro h1 { margin-top: 80px; font-size: 92px; }
  .intro .sub { margin: 30px auto 0; max-width: 820px; }
  .intro ul { margin-top: 56px; padding: 0; list-style: none; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .intro li { border: 1px solid rgba(232,202,141,0.45); color: #e8ca8d; border-radius: 999px; padding: 14px 28px; font-size: 26px; }
  .intro .foot { justify-content: center; }
</style></head>
<body>
<div class="post" id="post"></div>
<script>
  var p = (location.search.match(/p=(\d)/) || [])[1] || '1';
  var brand = '<div class="brand"><div class="s"><b>S</b><i></i></div><span>SAVOUR</span></div>';
  var foot = '<div class="foot"><span><b>savour.page</b></span><span>Gratis tot 100 recepten</span></div>';
  var phone = function (src) { return '<div class="phone"><div class="screen"><img src="../../../assets/app/' + src + '" alt=""></div></div>'; };
  var html = {
    1:
      '<div class="logo"><b>S</b><i></i></div>' +
      '<h1>Je recepten. <em>Eindelijk op één plek.</em></h1>' +
      '<p class="sub">Receptenbeheer voor professionele koks. Op elke telefoon in de keuken, voor je hele brigade.</p>' +
      '<ul><li>Kladjes inlezen</li><li>Omrekenen</li><li>Allergenen</li><li>MEP-lijsten</li><li>Keukenteams</li></ul>' +
      '<div class="foot"><span><b>savour.page</b></span></div>',
    2:
      brand +
      '<p class="kicker">Omrekenen</p>' +
      '<h1>Van 8 naar 16 personen. <em>Eén tik.</em></h1>' +
      '<p class="sub">Elke hoeveelheid rekent mee. Terug naar het origineel kan altijd.</p>' +
      phone('omrekenen-nl.jpg'),
    3:
      brand +
      '<p class="kicker">MEP-lijsten</p>' +
      '<h1>Je MEP-lijst. <em>Live voor de hele brigade.</em></h1>' +
      '<p class="sub">Vul de couverts in, Savour rekent per onderdeel uit wat er moet. Wie iets afvinkt, ziet iedereen meteen.</p>' +
      phone('mep-lijst-nl.jpg'),
    4:
      brand +
      '<p class="kicker">Allergenen</p>' +
      '<h1>De 14 allergenen. <em>Per ingrediënt.</em></h1>' +
      '<p class="sub">Per recept zie je in één oogopslag welk ingrediënt welk allergeen bevat. Klaar om te printen voor de bediening.</p>' +
      '<div class="card"><img src="allergenenkaart.png" alt=""></div>' +
      foot
  };
  // Engelse versie: ?p=1&lang=en (schermen uit de Engelse demo)
  if (/lang=en/.test(location.search)) {
    document.documentElement.lang = 'en';
    var footEn = '<div class="foot"><span><b>savour.page</b></span><span>Free up to 100 recipes</span></div>';
    html = {
      1:
        '<div class="logo"><b>S</b><i></i></div>' +
        '<h1>Your recipes. <em>Finally in one place.</em></h1>' +
        '<p class="sub">Recipe management for professional chefs. On every phone in the kitchen, for your whole brigade.</p>' +
        '<ul><li>Import notes</li><li>Scaling</li><li>Allergens</li><li>Prep lists</li><li>Kitchen teams</li></ul>' +
        '<div class="foot"><span><b>savour.page</b></span></div>',
      2:
        brand +
        '<p class="kicker">Scaling</p>' +
        '<h1>From 8 to 16 covers. <em>One tap.</em></h1>' +
        '<p class="sub">Every quantity scales along. You can always go back to the original.</p>' +
        phone('omrekenen-en.jpg'),
      3:
        brand +
        '<p class="kicker">Prep lists</p>' +
        '<h1>Your prep list. <em>Live for the whole brigade.</em></h1>' +
        '<p class="sub">Enter the covers and Savour works out what each item needs. Tick something off and everyone sees it instantly.</p>' +
        phone('mep-lijst-en.jpg'),
      4:
        brand +
        '<p class="kicker">Allergens</p>' +
        '<h1>The 14 allergens. <em>Per ingredient.</em></h1>' +
        '<p class="sub">See at a glance which ingredient contains which allergen. Ready to print for front of house.</p>' +
        '<div class="card"><img src="allergenenkaart-en.png" alt=""></div>' +
        footEn
    };
  }
  var el = document.getElementById('post');
  if (p === '1') el.classList.add('intro');
  el.innerHTML = html[p];
</script>
</body></html>
